name: Schema validate
on:
  push:
    paths:
      - "data_analysis/src/standardization/**"
      - "data_analysis/tests/test_schema_validate.py"
      - "data_analysis/tests/fixtures/**"
      - ".github/workflows/schema-validate.yml"
  pull_request:
    paths:
      - "data_analysis/src/standardization/**"
      - "data_analysis/tests/test_schema_validate.py"
      - "data_analysis/tests/fixtures/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest "data_analysis/tests/test_schema_validate.py" -q
